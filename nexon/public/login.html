<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 넥슨코리아 공용부 점검</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: min(360px, calc(100% - 32px));
    }
    @media (max-width: 400px) {
      .login-box { padding: 28px 20px; border-radius: 12px; }
      input, .btn-login { font-size: 16px; } /* iOS 줌 방지 */
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .nexon-badge {
      display: inline-block;
      background: #22c55e;
      color: #000;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .logo h1 {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .logo p {
      font-size: 12px;
      color: #475569;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: #e2e8f0;
      outline: none;
      transition: border 0.15s;
    }
    input:focus { border-color: #22c55e; }
    .btn-login {
      width: 100%;
      background: #22c55e;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn-login:hover { background: #16a34a; }
    .error-msg {
      display: none;
      background: #7f1d1d33;
      border: 1px solid #dc262655;
      color: #f87171;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 12px;
    }
    .hint {
      margin-top: 20px;
      padding: 12px;
      background: #0f172a;
      border-radius: 8px;
      font-size: 11px;
      color: #475569;
      line-height: 1.8;
    }
    .hint span { color: #94a3b8; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <div class="nexon-badge">NEXON</div>
    <h1>공용부 점검 플랫폼</h1>
    <p>Facility Inspection System</p>
  </div>

  <div class="form-group">
    <label>아이디</label>
    <input type="text" id="username" placeholder="아이디 입력" autocomplete="username">
  </div>
  <div class="form-group">
    <label>비밀번호</label>
    <input type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password">
  </div>
  <button class="btn-login" onclick="login()">로그인</button>
  <div class="error-msg" id="error-msg"></div>

  <div class="hint">
    관리자: <span>admin / admin1234</span><br>
    점검자: <span>inspector1 / inspect1234</span>
  </div>
</div>

<script>
  // 이미 로그인된 경우 리다이렉트
  fetch('/api/auth/me').then(r => {
    if (r.ok) return r.json().then(u => {
      location.href = u.role === 'admin' ? '/index.html' : '/inspect.html';
    });
  });

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('error-msg');

    if (!username || !password) {
      errEl.textContent = '아이디와 비밀번호를 입력하세요';
      errEl.style.display = 'block';
      return;
    }

    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (res.ok) {
      const data = await res.json();
      location.href = data.user.role === 'admin' ? '/index.html' : '/inspect.html';
    } else {
      const data = await res.json();
      errEl.textContent = data.error || '로그인 실패';
      errEl.style.display = 'block';
    }
  }
</script>
</body>
</html>
