<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>점검 수행 — 넥슨코리아</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .header {
      background: #1e293b; border-bottom: 1px solid #334155;
      padding: 0 20px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    }
    .header-logo { display: flex; align-items: center; gap: 10px; }
    .nexon-badge { background: #22c55e; color: #000; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
    .header-logo h1 { font-size: 15px; font-weight: 600; color: #f1f5f9; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .user-chip { font-size: 12px; color: #22c55e; font-weight: 600; }
    .btn { padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: #22c55e; color: #000; }
    .btn-primary:hover { background: #16a34a; }
    .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #334155; }
    .btn-outline:hover { background: #334155; }
    .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .badge-green { background: #14532d33; color: #4ade80; border: 1px solid #16a34a55; }
    .badge-red { background: #7f1d1d33; color: #f87171; border: 1px solid #dc262655; }
    .badge-amber { background: #78350f33; color: #fbbf24; border: 1px solid #d9770655; }
    .badge-blue { background: #1e3a5f33; color: #60a5fa; border: 1px solid #2563eb55; }
    .badge-gray { background: #1e293b; color: #64748b; border: 1px solid #33415555; }

    /* 레이아웃 */
    .layout { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 56px); margin-top: 56px; }

    /* 장소 패널 */
    .location-panel {
      background: #1e293b; border-right: 1px solid #334155;
      overflow-y: auto;
    }
    .panel-header { padding: 14px 16px; border-bottom: 1px solid #334155; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
    .location-group { font-size: 10px; font-weight: 700; color: #475569; letter-spacing: 1px; text-transform: uppercase; padding: 8px 16px 4px; background: #0f172a55; border-bottom: 1px solid #0f172a; border-top: 1px solid #0f172a; }
    .location-item {
      padding: 10px 16px 10px 22px; border-bottom: 1px solid #0f172a;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      border-left: 3px solid transparent; transition: all 0.1s;
    }
    .location-item:hover { background: #0f172a55; }
    .location-item.selected { border-left-color: #22c55e; background: #0f172a; }
    .loc-name { font-size: 13px; color: #cbd5e1; }
    .loc-detail { font-size: 11px; color: #475569; margin-top: 2px; }

    /* 점검 패널 */
    .inspect-panel { overflow-y: auto; padding: 24px; }
    .inspect-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .inspect-title { font-size: 18px; font-weight: 700; color: #f1f5f9; }
    .inspect-meta { font-size: 12px; color: #64748b; margin-top: 2px; }

    /* 장비 카드 그리드 */
    .eq-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 1200px) { .eq-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 800px)  { .eq-grid { grid-template-columns: 1fr; } }

    /* 장비 카드 */
    .eq-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 18px;
    }
    .eq-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .eq-name { font-size: 14px; font-weight: 600; color: #f1f5f9; }
    .eq-sub { font-size: 11px; color: #475569; margin-top: 3px; }
    .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .check-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .check-item input[type=checkbox] { width: 16px; height: 16px; accent-color: #22c55e; flex-shrink: 0; }
    .check-item span { font-size: 13px; color: #cbd5e1; }
    .issue-box {
      margin-top: 12px; padding: 12px; background: #0f172a;
      border-radius: 8px; border: 1px solid #ef444433;
    }
    .issue-box-title { font-size: 12px; color: #f87171; font-weight: 600; margin-bottom: 8px; }
    .issue-box textarea {
      width: 100%; background: transparent; border: none; color: #cbd5e1;
      font-size: 13px; resize: none; outline: none; height: 56px;
      font-family: inherit;
    }
    .issue-box-footer { display: flex; gap: 8px; margin-top: 8px; }
    .issue-box select {
      flex: 1; background: #1e293b; border: 1px solid #334155; color: #cbd5e1;
      padding: 5px 8px; border-radius: 6px; font-size: 12px;
    }
    .save-bar {
      display: flex; justify-content: flex-end; gap: 10px;
      padding-top: 16px; border-top: 1px solid #334155; margin-top: 4px;
    }
    .empty-panel { display: flex; align-items: center; justify-content: center; height: 100%; color: #475569; font-size: 14px; flex-direction: column; gap: 12px; }

    /* 완료 메시지 */
    .complete-banner {
      background: #14532d33; border: 1px solid #16a34a55; border-radius: 10px;
      padding: 16px 20px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .complete-banner .icon { font-size: 24px; }
    .complete-banner .text { font-size: 14px; color: #4ade80; font-weight: 600; }
    .complete-banner .sub { font-size: 12px; color: #16a34a; margin-top: 2px; }

    .saving-indicator { font-size: 12px; color: #22c55e; display: none; }

    /* 모바일 장소 드로어 */
    .loc-toggle {
      display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 97; background: #22c55e; color: #000; border: none;
      border-radius: 24px; padding: 10px 20px; font-size: 13px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      align-items: center; gap: 6px; white-space: nowrap;
    }
    .loc-overlay {
      display: none; position: fixed; inset: 0; top: 56px;
      background: rgba(0,0,0,0.55); z-index: 98;
    }
    .loc-overlay.open { display: block; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .location-panel {
        position: fixed; top: 56px; left: 0; bottom: 0; width: 280px;
        transform: translateX(-100%); transition: transform 0.25s ease;
        z-index: 99;
      }
      .location-panel.open { transform: translateX(0); }
      .loc-toggle { display: flex; }
      .inspect-panel { padding: 16px 14px 80px; }
      .eq-grid { grid-template-columns: 1fr !important; }
      .checklist { grid-template-columns: 1fr; }
      .header-logo h1 { font-size: 13px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <span class="nexon-badge">NEXON</span>
    <h1>공용부 점검 수행</h1>
  </div>
  <div class="header-right">
    <span class="user-chip" id="user-chip">—</span>
    <span class="saving-indicator" id="saving-indicator">저장 중...</span>
    <button class="btn btn-outline" onclick="logout()">로그아웃</button>
  </div>
</header>

<div class="loc-overlay" id="loc-overlay" onclick="closeLoc()"></div>
<button class="loc-toggle" onclick="toggleLoc()">📍 장소 선택</button>

<div class="layout">
  <!-- 장소 선택 패널 -->
  <div class="location-panel" id="location-panel">
    <div class="panel-header">📍 점검 장소</div>
    <div id="location-list"><div style="padding:20px;color:#475569;font-size:13px;">로딩 중...</div></div>
  </div>

  <!-- 점검 패널 -->
  <div class="inspect-panel" id="inspect-panel">
    <div class="empty-panel">
      <div style="font-size:36px">📋</div>
      <div>왼쪽에서 점검할 장소를 선택하세요</div>
    </div>
  </div>
</div>

<script>
  const CHECK_LABELS = {
    TV:      ['전원 정상', '화면 출력 정상', '네트워크 연결 정상', '케이블 연결 정상', '음성 출력 정상', '특이사항 없음'],
    DID:     ['DID 솔루션·라이선스 정상', 'Server/Client 정상 동작', '네트워크 연결 정상', '화면 정상 출력', '콘텐츠 정상 송출', '특이사항 없음'],
    SETTOP:  ['전원 정상', '콘텐츠 정상 송출', '네트워크 연결 정상', '케이블 연결 정상', '시스템 오류 없음', '특이사항 없음'],
    PC:      ['전원 정상', 'OS 부팅 정상', '네트워크 연결 정상', '이미지 Load 정상', '주변기기 정상', '특이사항 없음'],
    MIC:     ['전원 정상', '음성 출력 정상', '연결 상태 정상', '케이블 연결 정상', '수신 상태 정상', '특이사항 없음'],
    SPEAKER: ['전원 정상', '음성 출력 정상', '케이블 연결 정상', '좌우 밸런스 정상', '볼륨 정상', '특이사항 없음'],
    CAMERA:  ['전원 정상', '화상 출력 정상', '연결 상태 정상', '네트워크 연결 정상', '영상 품질 정상', '특이사항 없음'],
  };
  const CHECK_FIELDS = ['power_ok', 'screen_ok', 'network_ok', 'cable_ok', 'content_ok', 'no_issues'];

  let currentSession = null;
  let currentUser = null;
  let saveTimer = {};

  async function init() {
    const me = await fetch('/api/auth/me');
    if (!me.ok) { location.href = '/login.html'; return; }
    currentUser = await me.json();
    document.getElementById('user-chip').textContent = `👤 ${currentUser.name}`;
    loadLocations();
  }

  async function loadLocations() {
    const res = await fetch('/api/locations');
    const { grouped } = await res.json();

    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth() + 1;

    // 현재 월 세션 상태 조회
    const sessRes = await fetch(`/api/sessions?year=${year}&month=${month}`);
    const sessions = await sessRes.json();
    const sessMap = {};
    sessions.forEach(s => { sessMap[s.location_id] = s; });

    const html = Object.entries(grouped).map(([building, locs]) =>
      `<div class="location-group">${building}</div>` +
      locs.map(loc => {
        const sess = sessMap[loc.id];
        let badge = '<span class="badge badge-gray">미시작</span>';
        if (sess?.status === 'completed') badge = '<span class="badge badge-green">완료</span>';
        else if (sess?.status === 'in_progress') badge = '<span class="badge badge-amber">진행중</span>';
        return `<div class="location-item" id="loc-${loc.id}" onclick="selectLocation(${loc.id}, '${building} ${loc.name}')">
          <div>
            <div class="loc-name">${loc.name}</div>
            <div class="loc-detail">${building}</div>
          </div>
          ${badge}
        </div>`;
      }).join('')
    ).join('');

    document.getElementById('location-list').innerHTML = html;
  }

  function toggleLoc() {
    document.getElementById('location-panel').classList.toggle('open');
    document.getElementById('loc-overlay').classList.toggle('open');
  }
  function closeLoc() {
    document.getElementById('location-panel').classList.remove('open');
    document.getElementById('loc-overlay').classList.remove('open');
  }

  async function selectLocation(locationId, locationName) {
    document.querySelectorAll('.location-item').forEach(el => el.classList.remove('selected'));
    document.getElementById('loc-' + locationId)?.classList.add('selected');
    if (window.innerWidth <= 768) closeLoc();

    document.getElementById('inspect-panel').innerHTML = '<div class="empty-panel"><div style="font-size:24px">⏳</div><div>장비 목록 로딩 중...</div></div>';

    const res = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ location_id: locationId })
    });
    const data = await res.json();
    currentSession = data.session;
    renderChecklist(locationName, data.session, data.equipment);
  }

  function renderChecklist(locationName, session, equipment) {
    const now = new Date();
    const isCompleted = session.status === 'completed';

    const completedBanner = isCompleted ? `
      <div class="complete-banner">
        <div class="icon">✅</div>
        <div>
          <div class="text">점검 완료</div>
          <div class="sub">완료일시: ${session.completed_at}</div>
        </div>
      </div>` : '';

    const eqCards = equipment.map(eq => {
      const labels = CHECK_LABELS[eq.type] || CHECK_LABELS.TV;
      const checks = CHECK_FIELDS.map((field, i) => {
        const checked = eq[field] !== undefined ? eq[field] : 1;
        return `<label class="check-item">
          <input type="checkbox" ${checked ? 'checked' : ''} ${isCompleted ? 'disabled' : ''}
            onchange="onCheckChange(${session.id}, ${eq.id}, '${eq.equipment_code}')">
          <span>${labels[i]}</span>
        </label>`;
      }).join('');

      const hasIssue = eq.no_issues === 0 || eq.no_issues === false;
      const issueBox = `
        <div class="issue-box" id="issue-${eq.id}" style="display:${hasIssue && !isCompleted ? 'block' : (hasIssue ? 'block' : 'none')}">
          <div class="issue-box-title">⚠️ 이상 내용</div>
          <textarea id="desc-${eq.id}" placeholder="증상 및 조치 내용..." ${isCompleted ? 'disabled' : ''}
            onblur="saveResult(${session.id}, ${eq.id})"
          >${eq.issue_description || ''}</textarea>
          <div class="issue-box-footer">
            <select id="action-${eq.id}" ${isCompleted ? 'disabled' : ''} onchange="saveResult(${session.id}, ${eq.id})">
              <option value="issue" ${eq.action_status === 'issue' ? 'selected' : ''}>확인중</option>
              <option value="as_request" ${eq.action_status === 'as_request' ? 'selected' : ''}>AS 접수</option>
              <option value="completed" ${eq.action_status === 'completed' ? 'selected' : ''}>조치 완료</option>
            </select>
          </div>
        </div>`;

      const statusBadge = hasIssue
        ? '<span class="badge badge-red" id="status-' + eq.id + '">이상</span>'
        : (eq.result_id != null
          ? '<span class="badge badge-green" id="status-' + eq.id + '">정상</span>'
          : '<span class="badge badge-gray" id="status-' + eq.id + '">미점검</span>');

      return `
        <div class="eq-card">
          <div class="eq-card-header">
            <div>
              <div class="eq-name">${eq.name} <span style="font-size:11px;color:#475569;font-weight:400;">(${eq.equipment_code})</span></div>
              <div class="eq-sub">${eq.model || ''}</div>
            </div>
            ${statusBadge}
          </div>
          <div class="checklist" id="checks-${eq.id}">${checks}</div>
          ${issueBox}
        </div>`;
    }).join('');

    const saveBar = !isCompleted ? `
      <div class="save-bar">
        <button class="btn btn-outline" onclick="loadLocations()">목록으로</button>
        <button class="btn btn-primary" onclick="completeSession(${session.id})">✅ 점검 완료 저장</button>
      </div>` : `
      <div class="save-bar">
        <button class="btn btn-outline" onclick="loadLocations()">목록으로</button>
      </div>`;

    document.getElementById('inspect-panel').innerHTML = `
      ${completedBanner}
      <div class="inspect-header">
        <div>
          <div class="inspect-title">${locationName}</div>
          <div class="inspect-meta">점검자: ${currentUser.name} | ${now.getFullYear()}년 ${now.getMonth()+1}월</div>
        </div>
        <div style="font-size:13px;color:#64748b">장비 ${equipment.length}개</div>
      </div>
      <div class="eq-grid">${eqCards}</div>
      ${saveBar}`;
  }

  function onCheckChange(sessionId, equipmentId, code) {
    // 모든 체크박스 상태 읽기
    const checks = document.querySelectorAll(`#checks-${equipmentId} input[type=checkbox]`);
    const values = Array.from(checks).map(c => c.checked);
    const allOk = values.every(v => v);

    // 배지 업데이트
    const badge = document.getElementById('status-' + equipmentId);
    if (badge) {
      badge.className = `badge ${allOk ? 'badge-green' : 'badge-red'}`;
      badge.textContent = allOk ? '정상' : '이상';
    }

    // 이상 박스 표시/숨김
    const issueBox = document.getElementById('issue-' + equipmentId);
    if (issueBox) issueBox.style.display = allOk ? 'none' : 'block';

    // 디바운스 저장
    clearTimeout(saveTimer[equipmentId]);
    saveTimer[equipmentId] = setTimeout(() => saveResult(sessionId, equipmentId), 800);
  }

  async function saveResult(sessionId, equipmentId) {
    const checks = document.querySelectorAll(`#checks-${equipmentId} input[type=checkbox]`);
    const values = Array.from(checks).map(c => c.checked);

    const body = {
      equipment_id: equipmentId,
      power_ok: values[0], screen_ok: values[1], network_ok: values[2],
      cable_ok: values[3], content_ok: values[4], no_issues: values[5],
      issue_description: document.getElementById('desc-' + equipmentId)?.value || null,
      action_taken: null,
      action_status: document.getElementById('action-' + equipmentId)?.value || 'normal',
    };

    const ind = document.getElementById('saving-indicator');
    ind.style.display = 'inline';

    await fetch(`/api/sessions/${sessionId}/results`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    setTimeout(() => { ind.style.display = 'none'; }, 1000);
  }

  async function completeSession(sessionId) {
    // 미저장 결과 일괄 저장
    const cards = document.querySelectorAll('.eq-card');
    for (const card of cards) {
      const checksEl = card.querySelector('[id^="checks-"]');
      if (!checksEl) continue;
      const eqId = checksEl.id.replace('checks-', '');
      await saveResult(sessionId, parseInt(eqId));
    }

    const res = await fetch(`/api/sessions/${sessionId}/complete`, { method: 'PUT' });
    if (res.ok) {
      loadLocations();
      alert('점검이 완료되었습니다.');
    }
  }

  async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/login.html';
  }

  init();
</script>
</body>
</html>
