services:
  - type: web
    name: it-asset-platform
    env: python
    rootDir: mgit-platform
    buildCommand: pip install -r requirements.txt
    startCommand: python init_data.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mgit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: dolbom-it
    env: node
    rootDir: onpre/Dolbom-it/dolbom-it
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dolbom_db_ulth
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

databases:
  - name: mgit-db
    databaseName: mgit
    user: mgit_user

  - name: dolbom_db_ulth
    databaseName: dolbom_db_ulth
    user: dolbom_db_ulth_user
