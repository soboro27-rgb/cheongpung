services:
  - type: web
    name: it-asset-platform
    env: python
    rootDir: it-asset-platform
    buildCommand: pip install -r requirements.txt
    startCommand: python init_data.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mgit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: dolbom-it
    env: node
    rootDir: dolbom-it
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    domains:
      - dolbom.coretail.co.kr
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dolbom_db_ulth
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://dolbom.coretail.co.kr
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

  - type: web
    name: idc-server-collect
    env: python
    rootDir: idc-server-collect
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: kakao-skill-server
    env: node
    rootDir: kakao-skill-server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SOLAPI_API_KEY
        sync: false
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SOLAPI_SENDER
        sync: false
      - key: NOTIFY_PHONE
        sync: false

  - type: web
    name: nexon-inspection
    env: node
    rootDir: nexon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false

  - type: web
    name: inspect01
    env: node
    rootDir: inspect01
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run seed && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inspect01-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: mgit-db
    databaseName: mgit
    user: mgit_user

  - name: dolbom_db_ulth
    databaseName: dolbom_db_ulth
    user: dolbom_db_ulth_user

  - name: idc-db
    databaseName: idc_collect
    user: idc_user
    plan: free

  - name: inspect01-db
    databaseName: inspect01
    user: inspect01_user
