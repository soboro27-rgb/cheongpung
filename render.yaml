services:
  - type: web
    name: it-asset-platform
    env: python
    rootDir: mgit-platform
    buildCommand: pip install -r requirements.txt
    startCommand: python init_data.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mgit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: mgit-db
    databaseName: mgit
    user: mgit_user
