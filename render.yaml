services:
  - type: web
    name: it-asset-platform
    runtime: node
    repo: https://github.com/soboro27-rgb/cheongpung
    branch: main
    rootDir: cheongpung/itad-quotation-system
    buildCommand: npm install -g pnpm@9 && pnpm install --no-frozen-lockfile && pnpm exec prisma generate && pnpm build
    startCommand: pnpm start
    plan: starter
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
