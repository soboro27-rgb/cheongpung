{% extends "base.html" %}

{% block title %}로그인 — IDC 수거 플랫폼{% endblock %}

{% block full_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg,#1a2035 0%,#2d3a57 100%);">
  <div class="card shadow" style="width: 360px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="mb-2" style="font-size:2.5rem; color:#1a2035;"><i class="bi bi-server"></i></div>
        <h5 class="fw-bold mb-0">IDC 서버 수거 플랫폼</h5>
        <small class="text-muted">WorldMemory 운영</small>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label small fw-semibold">아이디</label>
          <input type="text" name="login_id" class="form-control" placeholder="아이디 입력" required autofocus />
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">비밀번호</label>
          <input type="password" name="password" class="form-control" placeholder="비밀번호 입력" required />
        </div>
        <button class="btn btn-primary w-100" type="submit">
          <i class="bi bi-box-arrow-in-right me-1"></i>로그인
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
