{% extends "base.html" %}
{% block title %}로그인 — 월드와이드메모리 IDC 수거 플랫폼{% endblock %}

{% block full_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center position-relative overflow-hidden"
     style="background: linear-gradient(145deg, #060d1e 0%, #0b1d38 35%, #0d2a50 65%, #071526 100%);">

  <!-- 배경 장식 -->
  <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;">
    <!-- 그리드 패턴 -->
    <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:0.045" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
          <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#60a5fa" stroke-width="0.6"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
    </svg>
    <!-- 글로우 원 -->
    <div style="position:absolute;width:500px;height:500px;border-radius:50%;
      background:radial-gradient(circle,rgba(29,78,216,0.12) 0%,transparent 70%);
      top:-120px;right:-80px;"></div>
    <div style="position:absolute;width:400px;height:400px;border-radius:50%;
      background:radial-gradient(circle,rgba(8,145,178,0.1) 0%,transparent 70%);
      bottom:-100px;left:-80px;"></div>
    <!-- 플로팅 점 -->
    <div style="position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(96,165,250,0.4);top:18%;left:12%;"></div>
    <div style="position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(56,189,248,0.35);top:32%;right:15%;"></div>
    <div style="position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(99,102,241,0.3);bottom:22%;left:18%;"></div>
    <div style="position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(96,165,250,0.3);bottom:38%;right:12%;"></div>
  </div>

  <div class="position-relative" style="z-index:1;width:100%;max-width:420px;padding:0 16px;">

    <!-- 메인 카드 -->
    <div class="card border-0" style="border-radius:20px;overflow:hidden;
      box-shadow:0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);">

      <!-- 브랜드 헤더 -->
      <div class="text-center pt-5 pb-4 px-4"
           style="background:linear-gradient(180deg,#0b1d38 0%,#0f2d50 100%);
           border-bottom:1px solid rgba(255,255,255,0.07);">

        <!-- WM 로고 아이콘 -->
        <div class="mx-auto mb-4 d-flex align-items-center justify-content-center"
             style="width:76px;height:76px;border-radius:20px;
             background:linear-gradient(135deg,#1d4ed8 0%,#0891b2 100%);
             box-shadow:0 8px 32px rgba(29,78,216,0.45), 0 0 0 1px rgba(255,255,255,0.1);">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- 메모리 칩 외곽 -->
            <rect x="9" y="9" width="26" height="26" rx="4" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.6"/>
            <!-- 칩 내부 -->
            <rect x="15" y="15" width="14" height="14" rx="2.5" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
            <!-- 핀 왼쪽 -->
            <line x1="4" y1="16" x2="9" y2="16" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="4" y1="22" x2="9" y2="22" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="4" y1="28" x2="9" y2="28" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <!-- 핀 오른쪽 -->
            <line x1="35" y1="16" x2="40" y2="16" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="35" y1="22" x2="40" y2="22" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="35" y1="28" x2="40" y2="28" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <!-- 핀 위 -->
            <line x1="16" y1="4" x2="16" y2="9" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="22" y1="4" x2="22" y2="9" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="28" y1="4" x2="28" y2="9" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <!-- 핀 아래 -->
            <line x1="16" y1="35" x2="16" y2="40" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="22" y1="35" x2="22" y2="40" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="28" y1="35" x2="28" y2="40" stroke="rgba(255,255,255,0.8)" stroke-width="1.6" stroke-linecap="round"/>
            <!-- WM 텍스트 -->
            <text x="22" y="25.5" text-anchor="middle" fill="white" font-size="6.5"
              font-weight="800" font-family="Arial,sans-serif" letter-spacing="0.5">WM</text>
          </svg>
        </div>

        <!-- 회사명 -->
        <h4 class="fw-bold mb-1" style="color:#f0f6ff;letter-spacing:-0.3px;font-size:1.25rem;">
          월드와이드메모리
        </h4>
        <p style="color:rgba(148,187,233,0.7);font-size:0.78rem;letter-spacing:0.3px;margin-bottom:16px;">
          WorldWideMemory Co., Ltd.
        </p>

        <!-- 서비스 배지 -->
        <span style="display:inline-block;background:rgba(8,145,178,0.18);color:#38bdf8;
          font-size:0.73rem;padding:4px 16px;border-radius:20px;
          border:1px solid rgba(56,189,248,0.25);letter-spacing:0.3px;">
          <i class="bi bi-server me-1" style="font-size:0.7rem;"></i>IDC 서버 수거 플랫폼
        </span>
      </div>

      <!-- 로그인 폼 -->
      <div class="card-body p-4" style="background:#ffffff;">

        {% if error %}
        <div class="alert py-2 small mb-3 d-flex align-items-center gap-2"
          style="background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:10px;">
          <i class="bi bi-exclamation-circle-fill"></i>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label small fw-semibold mb-1" style="color:#475569;">아이디</label>
            <div class="input-group" style="border-radius:10px;overflow:hidden;">
              <span class="input-group-text border-end-0" style="background:#f8fafc;border-color:#e2e8f0;">
                <i class="bi bi-person" style="color:#94a3b8;"></i>
              </span>
              <input type="text" name="login_id" class="form-control border-start-0 ps-1"
                style="background:#f8fafc;border-color:#e2e8f0;box-shadow:none;"
                placeholder="아이디를 입력하세요" required autofocus />
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold mb-1" style="color:#475569;">비밀번호</label>
            <div class="input-group" style="border-radius:10px;overflow:hidden;">
              <span class="input-group-text border-end-0" style="background:#f8fafc;border-color:#e2e8f0;">
                <i class="bi bi-lock" style="color:#94a3b8;"></i>
              </span>
              <input type="password" name="password" class="form-control border-start-0 ps-1"
                style="background:#f8fafc;border-color:#e2e8f0;box-shadow:none;"
                placeholder="비밀번호를 입력하세요" required />
            </div>
          </div>
          <button class="btn w-100 fw-semibold text-white" type="submit"
            style="background:linear-gradient(135deg,#1d4ed8 0%,#0891b2 100%);
            border:none;padding:11px;border-radius:10px;letter-spacing:0.3px;
            box-shadow:0 4px 16px rgba(29,78,216,0.3);font-size:0.95rem;
            transition:all 0.2s;"
            onmouseover="this.style.boxShadow='0 6px 24px rgba(29,78,216,0.5)';this.style.transform='translateY(-1px)'"
            onmouseout="this.style.boxShadow='0 4px 16px rgba(29,78,216,0.3)';this.style.transform='translateY(0)'">
            <i class="bi bi-box-arrow-in-right me-2"></i>로그인
          </button>
        </form>

        <div class="d-flex align-items-center gap-2 my-3">
          <div style="flex:1;height:1px;background:#e2e8f0;"></div>
          <span style="color:#cbd5e1;font-size:0.72rem;">안내</span>
          <div style="flex:1;height:1px;background:#e2e8f0;"></div>
        </div>

        <div class="d-flex gap-2">
          <a href="/intro/dealer" class="btn btn-sm flex-fill"
            style="border:1px solid #e2e8f0;color:#64748b;border-radius:8px;
            font-size:0.78rem;background:#f8fafc;padding:7px;">
            <i class="bi bi-building me-1" style="color:#94a3b8;"></i>호스팅사 안내
          </a>
          <a href="/intro/customer" class="btn btn-sm flex-fill"
            style="border:1px solid #e2e8f0;color:#64748b;border-radius:8px;
            font-size:0.78rem;background:#f8fafc;padding:7px;">
            <i class="bi bi-server me-1" style="color:#94a3b8;"></i>기업 안내
          </a>
        </div>
      </div>
    </div>

    <!-- 카피라이트 -->
    <p class="text-center mt-4 mb-0" style="color:rgba(255,255,255,0.22);font-size:0.7rem;letter-spacing:0.3px;">
      © 2025 WorldWideMemory Co., Ltd. All rights reserved.
    </p>
  </div>
</div>
{% endblock %}
