{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block page_title %}<i class="bi bi-key me-2"></i>비밀번호 변경{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header fw-semibold small">비밀번호 변경</div>
      <div class="card-body">
        {% if success %}
        <div class="alert alert-success">
          <i class="bi bi-check-circle me-2"></i>비밀번호가 성공적으로 변경되었습니다.
        </div>
        {% else %}
          {% if error %}
          <div class="alert alert-danger py-2 small">{{ error }}</div>
          {% endif %}
          <form method="post" action="/change-password">
            <div class="mb-3">
              <label class="form-label small fw-semibold">현재 비밀번호</label>
              <input type="password" name="current_password" class="form-control form-control-sm" required autocomplete="current-password" />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">새 비밀번호</label>
              <input type="password" name="new_password" class="form-control form-control-sm" required autocomplete="new-password" minlength="6" />
              <div class="form-text">6자 이상</div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">새 비밀번호 확인</label>
              <input type="password" name="confirm_password" class="form-control form-control-sm" required autocomplete="new-password" />
            </div>
            <button class="btn btn-primary btn-sm w-100">변경하기</button>
          </form>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
