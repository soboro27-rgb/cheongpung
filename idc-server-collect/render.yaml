services:
  - type: web
    name: idc-server-collect
    env: python
    rootDir: idc-server-collect
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: idc-db
    databaseName: idc_collect
    user: idc_user
    plan: free
