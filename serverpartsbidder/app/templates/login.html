{% extends "base.html" %}
{% block body %}
<div class="card auth">
  <h1>로그인</h1>
  <form method="post" action="/login" style="display:flex;flex-direction:column;gap:12px">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="lid">휴대폰 번호 (관리자는 아이디)<input id="lid" name="login_id" required autocomplete="username"></label>
    <label for="pw">비밀번호<input id="pw" type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn accent">로그인</button>
  </form>
  <p class="small muted">처음이신가요? <a href="/signup">가입 신청</a> · 비밀번호를 잊으셨으면 담당자에게 연락 주세요.</p>
</div>
{% endblock %}
