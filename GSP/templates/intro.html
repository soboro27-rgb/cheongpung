<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GSP — 소개</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <style>
    :root { --navy:#1a2035; --accent:#4f8ef7; }
    body {
      font-family: 'Segoe UI','Noto Sans KR',sans-serif;
      background: linear-gradient(135deg,#1a2035 0%,#2d3a57 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .hub-card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 1.5rem;
      padding: 2.8rem 2.4rem;
      color: #fff;
      cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
      text-decoration: none;
      display: block;
    }
    .hub-card:hover {
      background: rgba(255,255,255,.12);
      border-color: var(--accent);
      transform: translateY(-4px);
      color: #fff;
    }
    .hub-icon { font-size: 2.8rem; margin-bottom: 1.2rem; }
    .hub-card h3 { font-size: 1.25rem; font-weight: 800; margin-bottom: .5rem; }
    .hub-card p { font-size: .88rem; color: rgba(255,255,255,.65); line-height: 1.7; margin: 0; }
    .hub-card .arrow {
      display: inline-block; margin-top: 1.2rem;
      font-size: .85rem; color: var(--accent); font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="text-center mb-5" style="color:#fff;">
    <div style="font-size:2rem;"><i class="bi bi-server"></i></div>
    <h1 style="font-size:1.6rem; font-weight:800; margin-top:.6rem;">GSP <span style="font-weight:400; color:rgba(255,255,255,.6); font-size:1rem;">Great Server Plan</span></h1>
    <p style="color:rgba(255,255,255,.6); font-size:.9rem;">소개를 보실 대상을 선택해 주세요</p>
  </div>

  <div class="container" style="max-width:700px;">
    <div class="row g-4">
      <div class="col-md-6">
        <a href="/intro/dealer" class="hub-card">
          <div class="hub-icon">🏢</div>
          <h3>호스팅·IDC 운영사</h3>
          <p>고객사 서버를 관리 중인 호스팅사·IDC 운영사를 위한 소개입니다.</p>
          <div class="arrow">소개 보기 <i class="bi bi-arrow-right"></i></div>
        </a>
      </div>
      <div class="col-md-6">
        <a href="/intro/customer" class="hub-card">
          <div class="hub-icon">🖥️</div>
          <h3>서버 보유 기업</h3>
          <p>방치 서버 처리와 데이터 파기가 필요한 기업 고객사를 위한 소개입니다.</p>
          <div class="arrow">소개 보기 <i class="bi bi-arrow-right"></i></div>
        </a>
      </div>
    </div>
    <div class="text-center mt-5">
      <a href="/login" style="color:rgba(255,255,255,.45); font-size:.85rem; text-decoration:none;">
        <i class="bi bi-box-arrow-in-right me-1"></i>계정이 있으신가요? 로그인
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
