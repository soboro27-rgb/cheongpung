<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7CFFB2"/>
      <stop offset="100%" stop-color="#38495a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#0b0f13"/>

  <!-- ===== Primary lockup: silhouette + wordmark ===== -->
  <g transform="translate(180,150)">
    <!-- ripple rings behind -->
    <circle cx="230" cy="70" r="150" fill="none" stroke="#1c2731" stroke-width="1.5"/>
    <circle cx="230" cy="70" r="110" fill="none" stroke="#1c2731" stroke-width="1.5"/>
    <circle cx="230" cy="70" r="70" fill="none" stroke="#24313d" stroke-width="1.5"/>

    <!-- minimal catfish silhouette: blunt rounded head (right), tapering to tail point (left) -->
    <path d="M 40 70
             C 60 20, 150 5, 250 15
             C 295 20, 325 35, 335 70
             C 325 105, 295 120, 250 125
             C 150 135, 60 120, 40 70 Z"
          fill="url(#bodyGrad)"/>

    <!-- tail fin -->
    <path d="M 40 70 L -10 40 L 5 70 L -10 100 Z" fill="#7CFFB2"/>

    <!-- whiskers (barbels) - the signature detail, from blunt head front -->
    <path d="M 333 55 C 375 42, 405 32, 435 28" stroke="#7CFFB2" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 335 70 C 378 70, 410 72, 440 75" stroke="#7CFFB2" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 333 85 C 373 98, 403 108, 425 122" stroke="#7CFFB2" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- eye -->
    <circle cx="270" cy="55" r="5" fill="#0b0f13"/>
  </g>

  <!-- wordmark -->
  <text x="450" y="330" text-anchor="middle" font-size="46" font-weight="800" fill="#f2f2f4" font-family="sans-serif" letter-spacing="1">CATFISH AI</text>
  <text x="450" y="365" text-anchor="middle" font-size="16" fill="#7CFFB2" font-family="sans-serif" letter-spacing="4">캐피시AI</text>
  <text x="450" y="400" text-anchor="middle" font-size="14" fill="#6a7580" font-family="sans-serif" letter-spacing="2">STIR THE STILL WATER</text>

  <!-- small mark variant bottom left for reference -->
  <g transform="translate(70,440) scale(0.35)">
    <path d="M 40 70 C 60 20, 150 5, 250 15 C 295 20, 325 35, 335 70 C 325 105, 295 120, 250 125 C 150 135, 60 120, 40 70 Z" fill="#7CFFB2"/>
    <path d="M 40 70 L -10 40 L 5 70 L -10 100 Z" fill="#7CFFB2"/>
    <path d="M 333 55 C 375 42, 405 32, 435 28" stroke="#7CFFB2" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 335 70 C 378 70, 410 72, 440 75" stroke="#7CFFB2" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 333 85 C 373 98, 403 108, 425 122" stroke="#7CFFB2" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <circle cx="270" cy="55" r="9" fill="#0b0f13"/>
  </g>
  <text x="140" y="450" font-size="12" fill="#4a5560" font-family="sans-serif">— Icon-only mark (favicon / app icon 용)</text>
</svg>
