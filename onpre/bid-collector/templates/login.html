<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — WWM 검수</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 100%);min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      font-family:'Malgun Gothic',-apple-system,sans-serif;}
    .card{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:360px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);}
    .co{font-size:11px;font-weight:800;color:#2563EB;letter-spacing:.1em;text-transform:uppercase;}
    .brand{font-size:20px;font-weight:900;color:#0F172A;margin-top:2px;}
    .form-label{font-size:12px;font-weight:700;color:#374151;}
    .form-control:focus{border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.12);}
    .btn-login{background:#2563EB;border:none;color:#fff;font-weight:700;
      border-radius:8px;padding:11px;width:100%;font-size:14px;}
    .btn-login:hover{background:#1D4ED8;}
  </style>
</head>
<body>
<div class="card">
  <div class="mb-4">
    <div class="co">월드와이드메모리(주)</div>
    <div class="brand">매입검수 플랫폼</div>
  </div>

  {% with msgs = get_flashed_messages(with_categories=true) %}
  {% if msgs %}{% for cat, msg in msgs %}
  <div class="alert alert-{{ 'danger' if cat=='danger' else 'warning' }} py-2 mb-3" style="font-size:13px;">{{ msg }}</div>
  {% endfor %}{% endif %}{% endwith %}

  <form method="post">
    <div class="mb-3">
      <label class="form-label">아이디</label>
      <input type="text" name="username" class="form-control" placeholder="아이디 입력" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label">비밀번호</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login">로그인</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
