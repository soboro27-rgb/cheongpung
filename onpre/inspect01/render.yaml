services:
  - type: web
    name: inspect01
    env: node
    rootDir: onpre/inspect01
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run seed && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inspect01-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: inspect01-db
    databaseName: inspect01
    user: inspect01_user
